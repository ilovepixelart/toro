version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
