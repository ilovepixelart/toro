name: Release

# A version tag (v*) builds and publishes to PyPI via trusted publishing (OIDC)
# - no API tokens stored. The publish job runs in the `pypi` environment, which
# must match the trusted publisher registered on PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing here needs to write to the repository; the publish job asks for the one
# permission it does need (id-token) for itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Build sdist + wheel
        run: uv build
      # The tag starts the release and `toro/__init__.py` supplies the version;
      # nothing else makes them agree. A PyPI upload cannot be taken back, so a
      # mismatch has to fail here, while failing is still free. The tag arrives
      # through the environment, never interpolated into the script.
      - name: Refuse a tag that does not match the version built
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          built=$(ls dist/*.whl | head -1 | awk -F- '{print $2}')
          if [ "$built" != "${TAG#v}" ]; then
            echo "tag $TAG does not match the built version $built" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # Pinned to a release, not to the branch: this job holds the OIDC token that
        # publishes to PyPI, and `release/v1` is a branch anyone who can move it can
        # run code with. NOT a commit SHA: this is a Docker action and the runner
        # pulls ghcr.io/pypa/gh-action-pypi-publish:<ref>, which has no image for a
        # bare commit ("manifest unknown", verified the hard way).
        uses: pypa/gh-action-pypi-publish@v1.14.2
