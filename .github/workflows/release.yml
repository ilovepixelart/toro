name: Release

# A version tag (v*) builds and publishes to PyPI via trusted publishing (OIDC)
# - no API tokens stored. The publish job runs in the `pypi` environment, which
# must match the trusted publisher registered on PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing here needs to write to the repository; the publish job asks for the one
# permission it does need (id-token) for itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # Pinned to a commit, not to the branch: this job holds the OIDC token
        # that publishes to PyPI, and a mutable ref means whoever can move that
        # branch runs code with it. v1.13.0.
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598
