name: Release

# A version tag (v*) builds and publishes to PyPI via trusted publishing (OIDC)
# - no API tokens stored. The publish job runs in the `pypi` environment, which
# must match the trusted publisher registered on PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing here needs to write to the repository; the publish job asks for the one
# permission it does need (id-token) for itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # The one action here not pinned to a commit, and it cannot be: it is a
        # composite action that generates a Docker action at run time, and its
        # create-docker-action.py builds `ghcr.io/<repo>:<the ref you called it
        # with>`. Nothing is published under a bare commit, so a hash pin asks for
        # an image tag that never existed ("manifest unknown", verified twice).
        #
        # It stays for what it does that `uv publish` does not: it generates the
        # PEP 740 attestations that every file of this package currently carries.
        # A release tag is therefore the strongest pin available for it.
        uses: pypa/gh-action-pypi-publish@v1.14.2
