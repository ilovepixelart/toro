[project]
name = "toro-site"
version = "0.1.0"
description = "The toro website: served by the stack it documents."
requires-python = ">=3.12"
dependencies = [
    "toro-queue>=1.0.0",
    "matador-dashboard>=1.0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.uv.sources]
# The page is rendered from the checkout it lives in, so a docs change ships with
# the code change that caused it. matador still comes from PyPI.
toro-queue = { path = "..", editable = true }
