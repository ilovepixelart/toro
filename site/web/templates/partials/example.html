{# The use-case browser: the tabs and the code are one fragment, so htmx swaps
   both at once and the server owns which one is selected. No client state. #}
<div id="examples" class="grid sm:grid-cols-[minmax(0,190px)_minmax(0,1fr)] min-w-0">
  <nav class="border-b sm:border-b-0 sm:border-r border-line bg-panel2/40 p-2 flex sm:block gap-1 overflow-x-auto">
    {% for key, (title, _) in examples.items() %}
      <button type="button"
              hx-get="{{ base | default('') }}/examples/{{ key }}{{ '.html' if static | default(false) }}" hx-target="#examples" hx-swap="outerHTML"
              class="btn btn-sm w-auto sm:w-full justify-start whitespace-nowrap
                     {{ 'bg-accent/10 text-accent' if key == chosen else 'btn-ghost bg-transparent' }}">
        {{ title }}
      </button>
    {% endfor %}
  </nav>
  <div class="min-w-0">
    <div class="flex items-center gap-1.5 px-3 py-2 border-b border-line bg-panel2">
      <span class="w-2.5 h-2.5 rounded-full bg-line"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-line"></span>
      <span class="w-2.5 h-2.5 rounded-full bg-line"></span>
      <span class="ml-2 font-mono text-xs text-muted">{{ examples[chosen][0] }}</span>
    </div>
    <pre class="code min-w-0 p-4 font-mono text-sm leading-relaxed overflow-x-auto"><code>{{ examples[chosen][1] | py | safe }}</code></pre>
  </div>
</div>
